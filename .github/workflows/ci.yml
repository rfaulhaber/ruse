name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-rust-toolchain reads rust-toolchain.toml, so the pinned version and its
      # components are declared in exactly one place. It also handles caching, so no
      # separate rust-cache step is needed.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest

      - name: Check
        run: cargo check --all-targets

      - name: Build
        run: cargo build --verbose

      - name: Test (nextest)
        run: cargo nextest run --all-targets

      # nextest does not run doctests; run them separately.
      - name: Doctests
        run: cargo test --doc

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rustfmt
        run: cargo fmt --all -- --check
