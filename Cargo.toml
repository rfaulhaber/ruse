[package]
name = "ruse"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs-err = "3"
miette = { version = "7", features = ["fancy"] }
num-bigint = "0.5"
num-traits = "0.2"
rustyline = "18"
thiserror = "2"

[dev-dependencies]
# Disassembly is tested as snapshot text, never as raw bytes, so the opcode byte table
# stays cheap to renumber (frozen decision; see docs/project_plan.org).
insta = "1"

# Unsafe is denied for the whole package and re-enabled, file by file, only where it is
# unavoidable: `src/gc/mod.rs` (the collector), `src/gc/trace.rs` (the grey worklist),
# `src/value/object.rs` (trait declarations only), `src/vm/roots.rs` (the VM's root set
# and its safepoint — the one caller of the unsafe `Heap::collect`) and `tests/gc_drop.rs`.
# Adding an unsafe block anywhere else is a build error rather than a review question.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
disallowed_types = "deny"
# Every unsafe block must carry a `// SAFETY:` comment saying why it is sound.
undocumented_unsafe_blocks = "deny"
disallowed_methods = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[package.metadata.release]
allow-branch = ["main"]
sign-commit = true
sign-tag = true
push-remote = "origin"
tag-prefix = "v"
tag-name = "{{prefix}}{{version}}"
publish = true
